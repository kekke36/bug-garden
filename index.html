<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>むしとりゲーム</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hud">
        <div class="score-box">
          <span>スコア</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span>じかん</span>
          <strong id="time">30</strong>
        </div>
      </header>

      <button id="start-btn" class="start-btn">ゲームスタート</button>

      <section id="game-area" class="game-area" aria-label="むし取りゲーム">
        <div id="message" class="message">むしをつかまえよう！</div>
        <div id="bugs-layer" class="bugs-layer" aria-live="polite"></div>

        <div id="net" class="net" aria-hidden="true">
          <div class="net-ring"></div>
          <div class="net-handle"></div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
